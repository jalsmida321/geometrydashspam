<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Geometry Dash Spam</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">调试信息</h1>

        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-bold mb-4">当前环境：</h2>
            <div id="env-info"></div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-bold mb-4">文件存在性测试：</h2>
            <div id="file-tests"></div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-xl font-bold mb-4">游戏链接测试：</h2>
            <div id="game-links"></div>
        </div>
    </div>

    <script>
        // 显示环境信息
        const envInfo = document.getElementById('env-info');
        envInfo.innerHTML = `
            <p><strong>URL:</strong> ${window.location.href}</p>
            <p><strong>Host:</strong> ${window.location.host}</p>
            <p><strong>Hostname:</strong> ${window.location.hostname}</p>
            <p><strong>Path:</strong> ${window.location.pathname}</p>
            <p><strong>Origin:</strong> ${window.location.origin}</p>
            <p><strong>Protocol:</strong> ${window.location.protocol}</p>
        `;

        // 测试游戏文件
        const gameFiles = [
            '/index.html',
            '/games/aka-geometry-dash-spam.html',
            '/games/geometry-dash-spam-wave.html',
            '/games/Geometry-Dash-Spam-Test.html',
            '/games/geometry-dash-spam-challenge.html',
            '/games/geometry-dash-spam-master.html',
            '/games/geometry-dash-spam-chall.html',
            '/games/geometry-dash-wave-spam.html'
        ];

        const fileTests = document.getElementById('file-tests');
        const gameLinks = document.getElementById('game-links');

        gameFiles.forEach(file => {
            // 测试文件存在性
            const testDiv = document.createElement('div');
            testDiv.className = 'mb-2 p-2 bg-gray-700 rounded';
            testDiv.innerHTML = `
                <span class="font-mono">${file}</span>
                <span id="test-${file.replace(/[^a-zA-Z0-9]/g, '-')}" class="ml-2">测试中...</span>
                <button onclick="testFile('${file}')" class="ml-2 bg-blue-500 hover:bg-blue-600 px-2 py-1 rounded text-sm">
                    测试
                </button>
                <button onclick="window.open('${file}', '_blank')" class="ml-1 bg-green-500 hover:bg-green-600 px-2 py-1 rounded text-sm">
                    打开
                </button>
            `;
            fileTests.appendChild(testDiv);

            // 游戏链接测试
            const linkDiv = document.createElement('div');
            linkDiv.className = 'mb-2';
            linkDiv.innerHTML = `
                <a href="${file}" class="bg-purple-500 hover:bg-purple-600 px-4 py-2 rounded inline-block mr-2">
                    ${file}
                </a>
            `;
            gameLinks.appendChild(linkDiv);
        });

        // 测试文件存在性
        async function testFile(url) {
            const testSpan = document.getElementById(`test-${url.replace(/[^a-zA-Z0-9]/g, '-')}`);
            testSpan.textContent = '测试中...';
            testSpan.className = 'ml-2 text-yellow-400';

            try {
                const response = await fetch(url, { method: 'HEAD' });
                if (response.ok) {
                    testSpan.textContent = `✅ ${response.status}`;
                    testSpan.className = 'ml-2 text-green-400';
                } else {
                    testSpan.textContent = `❌ ${response.status}`;
                    testSpan.className = 'ml-2 text-red-400';
                }
            } catch (error) {
                testSpan.textContent = `❌ 错误: ${error.message}`;
                testSpan.className = 'ml-2 text-red-400';
            }
        }

        // 自动测试所有文件
        setTimeout(() => {
            gameFiles.forEach(file => {
                testFile(file);
            });
        }, 1000);
    </script>
</body>
</html>
